      - CORPORATE_AUTO_REBASELINE_ENABLED
      - CORPORATE_AUTO_VERIFY_ENABLED
      - CORPORATE_AUTO_VERIFY_MODE
      - CORPORATE_BOT_CONTACT_URL
      - CORPORATE_CENSUS_ENABLED
      - CORPORATE_EVIDENCE_WAY_BACK_ENABLED
      - CORPORATE_DOOR_FLAG_PAYCO=${CORPORATE_DOOR_FLAG_PAYCO:-false}
      - CORPORATE_DOOR_KINDS_LIVE=${CORPORATE_DOOR_KINDS_LIVE:-}
      - CORPORATE_DOORS_MODE=${CORPORATE_DOORS_MODE:-off}
      - CORPORATE_INTAKE_MODE=${CORPORATE_INTAKE_MODE:-shadow}
      - CORPORATE_WEEKLY_AUDIT_ENABLED
      - DB_IDLE_TIMEOUT_SECS
      - DB_MAX_LIFETIME_SECS
      - DB_MIN_CONNECTIONS
      - DB_SIZE_ERROR_MB
      - DB_SIZE_LIMIT_MB
      - DB_SIZE_WARN_MB
      - DOMAIN_APPROVAL_AUTO_RENEW
      - DOMAIN_APPROVAL_RENEW_WITHIN_DAYS
      - EXTRACTION_AI_ALLOW_ANY_PORT
      - EXTRACTION_AI_ENABLED
      - EXTRACTION_AI_FAILURE_COOLDOWN_HOURS
      - EXTRACTION_AI_KEEP_ALIVE
      - EXTRACTION_AI_MAX_PROGRAMS
      - EXTRACTION_AI_MODE
      - EXTRACTION_AI_MODEL
      - EXTRACTION_AI_NUM_THREADS
      - EXTRACTION_AI_QUEUE_MAX_PROGRAMS
