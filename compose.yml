      - BENEFIT_CRAWLER_TIMEOUT_SECS
      - BENEFIT_LLM_ENABLED
      - BENEFIT_LLM_MAX_CANDIDATES
      - BENEFIT_LLM_MODEL
      - BENEFIT_LLM_PROVIDER
      - BENEFIT_LLM_TIMEOUT_SECS
      - CORPORATE_AUTO_HIDE_REASONS
