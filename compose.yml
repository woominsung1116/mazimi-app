      - MIGRATION_DB_MAX_CONNECTIONS
      - NATIONAL_WELFARE_API_KEY
      - OPS_ALERT_DASHBOARD_URL
      - OPS_ALERT_EMAIL_MAX_BATCH
      - OPS_ALERT_EMAIL_MIN_SEVERITY
      - OPS_ALERT_EMAIL_TO
      - OPS_ALERT_MAX_BATCH
      - OPS_ALERT_MIN_SEVERITY
      - OPS_ALERT_WEBHOOK_FORMAT
      - OPS_ALERT_WEBHOOK_URL
      - PUBLISHER_OPTOUT_ENABLED
      - ROLLING_WINDOW_CONFIRMATION_ENABLED
      - ROLLING_WINDOW_CONFIRMATION_MAX
      - SCHOLARSHIP_DATASET_AUTO
      - SMTP_FROM
      - SMTP_HOST
      - SMTP_PASSWORD
      - SMTP_PORT
      - SMTP_USERNAME
      - SOURCE_ACTIVE_FLOOR_FSS_FINANCIAL
      - SOURCE_ACTIVE_FLOOR_FTC_BRAND_CATALOG
      - SOURCE_ACTIVE_FLOOR_GOV_BENEFITS
      - SOURCE_ACTIVE_FLOOR_LOCAL_WELFARE
      - SOURCE_ACTIVE_FLOOR_NATIONAL_WELFARE
      - SOURCE_ACTIVE_FLOOR_SCHOLARSHIP
      - SOURCE_ACTIVE_FLOOR_YOUTH_CENTER
      - SOURCE_ACTIVE_MAX_DROP_PCT
      - SOURCE_ALLOW_EMPTY_FSS_FINANCIAL
      - SOURCE_ALLOW_EMPTY_FTC_BRAND_CATALOG
      - SOURCE_ALLOW_EMPTY_GOV_BENEFITS
      - SOURCE_ALLOW_EMPTY_LOCAL_WELFARE
      - SOURCE_ALLOW_EMPTY_NATIONAL_WELFARE
      - SOURCE_ALLOW_EMPTY_SCHOLARSHIP
      - SOURCE_ALLOW_EMPTY_YOUTH_CENTER
      - SOURCE_REVIEW_GRACE_HOURS
      - SOURCE_REVIEW_SWEEP_LIMIT
