    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/mazimi-worker.ready -mmin -2 -print -quit 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256m
          pids: 256

  # Live official-page fetch for the agent's check_official_page (MCP over
  # Streamable HTTP). Off unless the `official-page` profile is started.
  # No database credentials, no env_file, no published port: the api reaches
  # it on the internal network with a shared bearer token.
  official-page:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.official-page
    profiles:
      - official-page
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      - RUST_LOG=info
      - OFFICIAL_PAGE_BIND=0.0.0.0:8090
      - OFFICIAL_PAGE_ALLOWED_HOSTS=official-page,official-page:8090
      - OFFICIAL_PAGE_MCP_TOKEN=${OFFICIAL_PAGE_MCP_TOKEN:-}
    # Its own network: it can reach the api's requests and the internet
    # (official sites), not the database, web or worker.
    networks:
      - official-page
    healthcheck:
      test: ["CMD", "official-page-mcp", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
          pids: 64

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: wello
      POSTGRES_USER: wello
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wello"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  # Keep database client tooling independent from the optional local database.
  # PostgreSQL 17 clients can back up both the current Supabase 17 service and
  # the local PostgreSQL 16 development database.
  db-tools:
    image: ${POSTGRES_CLIENT_IMAGE:-postgres:17-alpine}
    profiles:
      - tools
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
      - APP_DOMAIN=${APP_DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./releases/mobile:/srv/mobile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  default:
  official-page:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
