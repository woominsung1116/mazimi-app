      - FTC_BRAND_API_KEY
      - FTC_BRAND_BASE_YEAR
      - FTC_BRAND_PRODUCTION_APPROVED
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GOV_API_KEY
      - GOV_BENEFITS_API_KEY
      - JOB_DB_MAX_CONNECTIONS
      - KAKAO_CLIENT_ID
      - KAKAO_CLIENT_SECRET
      - KOSAF_API_KEY
      - MIGRATION_DB_MAX_CONNECTIONS
      - OFFICIAL_PAGE_MCP_TOKEN
      - OFFICIAL_PAGE_MCP_URL
      - PORTONE_API_KEY
      - PORTONE_API_SECRET
      - PUBLISHER_OPTOUT_ENABLED
      - SCHOLARSHIP_DATASET_AUTO
      - SOURCE_ALLOW_EMPTY_FSS_FINANCIAL
      - SOURCE_ALLOW_EMPTY_FTC_BRAND_CATALOG
      - SOURCE_ALLOW_EMPTY_GOV_BENEFITS
      - SOURCE_ALLOW_EMPTY_LOCAL_WELFARE
      - SOURCE_ALLOW_EMPTY_NATIONAL_WELFARE
      - SOURCE_ALLOW_EMPTY_SCHOLARSHIP
      - SOURCE_ALLOW_EMPTY_YOUTH_CENTER
      - VERIFIED_SECTION_ENABLED
      - WORKER_DB_MAX_CONNECTIONS
      - YOUTH_CENTER_API_KEY
    networks:
      - default
      # Reaches the official-page fetch service; nothing else is on it.
      - official-page
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --max-time 4 http://localhost:8080/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m
          pids: 256

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    # Least privilege: no JWT, OAuth or session secrets (see the api note).
    environment:
      - APP_ENV=production
      - RUST_LOG=info
      - WORKER_DB_MAX_CONNECTIONS=${WORKER_DB_MAX_CONNECTIONS:-5}
      - DB_CONNECT_ATTEMPTS=${DB_CONNECT_ATTEMPTS:-6}
      - DB_CONNECT_TIMEOUT_SECS=${DB_CONNECT_TIMEOUT_SECS:-10}
      - DB_ACQUIRE_TIMEOUT_SECS=${DB_ACQUIRE_TIMEOUT_SECS:-15}
      - DATABASE_URL=${DATABASE_URL}
      - KAKAO_BIZ_API_KEY=${KAKAO_BIZ_API_KEY:-}
      - KAKAO_BIZ_SENDER_KEY=${KAKAO_BIZ_SENDER_KEY:-}
      - API_DB_MAX_CONNECTIONS
      - APPLICATION_RESOURCES_ENABLED
      - FORM_AUTO_ENABLED
      - FORM_AUTO_IMPORT_ENABLED
      - FORM_AUTO_KEEP_DAYS
      - FORM_AUTO_MAX_FORMS
      - FORM_AUTO_MIN_FREE_GB
      - FORM_AUTO_RUN_ROOT
      - FORM_REVIEW_JUDGE
      - APPLICATION_RESOURCES_MAX_CHECKS
      - APPLICATION_RESOURCES_SEED_LIMIT
      - APPLICATION_RESOURCES_WELFARE_NATIONAL_PER_RUN
      - APPLICATION_RESOURCES_WELFARE_LOCAL_PER_RUN
      - APPLICATION_FORMS_PUBLISH
      - APPLICATION_FORMS_ACTOR_USER_ID
      - APPLICATION_FORMS_JUDGE
      - APPLICATION_FORMS_JUDGE_MODEL
      - APPLICATION_FORMS_JUDGE_URL
      - APPLICATION_FORMS_JUDGE_NUM_THREADS
      - APPLICATION_FORMS_JUDGE_MAX_CALLS
      - FORM_AUTO_ACTOR_USER_ID
      - ASSISTANT_AGENT_PROACTIVE_ENABLED
