name: mazimi

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN}
        # Build-time (inlined). Off until a served rule reads the answers.
        NEXT_PUBLIC_PROFILE_CONDITION_QUESTIONS_ENABLED: ${PROFILE_CONDITION_QUESTIONS_ENABLED:-false}
        # 소득 구간 question: on unless "false" (matching reads it).
        NEXT_PUBLIC_INCOME_QUESTION_ENABLED: ${INCOME_QUESTION_ENABLED:-true}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    environment:
      - NEXT_PUBLIC_API_BASE_URL=https://${DOMAIN}
      - NEXT_PUBLIC_PROFILE_CONDITION_QUESTIONS_ENABLED=${PROFILE_CONDITION_QUESTIONS_ENABLED:-false}
      - NEXT_PUBLIC_INCOME_QUESTION_ENABLED=${INCOME_QUESTION_ENABLED:-true}
      # Server-side token exchange, refresh, logout and the /bff proxy.
      - API_INTERNAL_URL=http://api:8080
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    # Least privilege: an explicit allowlist, not the whole .env.production.
    # Bare names take their value from the --env-file (unset stays unset).
    # scripts/check-service-env.py fails CI when code reads a name missing here.
    environment:
      - APP_ENV=production
      - APP_PORT=8080
      - RUST_LOG=info
      - PUBLIC_API_BASE_URL=https://${DOMAIN}
      - API_RUN_MIGRATIONS_ON_STARTUP=false
      - API_DB_MAX_CONNECTIONS=${API_DB_MAX_CONNECTIONS:-8}
      - DB_CONNECT_ATTEMPTS=${DB_CONNECT_ATTEMPTS:-6}
      - DB_CONNECT_TIMEOUT_SECS=${DB_CONNECT_TIMEOUT_SECS:-10}
      - DB_ACQUIRE_TIMEOUT_SECS=${DB_ACQUIRE_TIMEOUT_SECS:-15}
      - SHUTDOWN_GRACE_SECS=${SHUTDOWN_GRACE_SECS:-30}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - APP_DOMAIN
      - ASSISTANT_AGENT_BACKGROUND_AFTER_SECS
      - ASSISTANT_AGENT_CALENDAR_ENABLED
      - ASSISTANT_AGENT_DOCUMENT_LINKS_ENABLED
      - ASSISTANT_AGENT_ENABLED
      - ASSISTANT_AGENT_MAX_RUNS
      - ASSISTANT_AGENT_OFFICIAL_PAGE_ENABLED
      - ASSISTANT_AGENT_PLANNER_ENABLED
      - ASSISTANT_AGENT_PLANNER_DIGEST
      - ASSISTANT_AGENT_PLANNER_MODEL
      - ASSISTANT_AGENT_PLANNER_NUM_THREADS
      - ASSISTANT_AGENT_PLANNER_PROMPT
      - ASSISTANT_AGENT_PLANNER_REFUSALS
      - ANONYMOUS_PREVIEW_ENABLED
      - ASSISTANT_AGENT_JOURNEY_ENABLED
      - ASSISTANT_AGENT_PLANNER_URL
      - ASSISTANT_AGENT_PLAN_TIMEOUT_SECS
      - ASSISTANT_MODELS_ENABLED
      - ASSISTANT_AGENT_RUN_TIMEOUT_SECS
      - ASSISTANT_AGENT_WARMUP
      - ASSISTANT_AI_ENABLED
      - ASSISTANT_AI_MODEL
      - ASSISTANT_AI_NUM_THREADS
      - ASSISTANT_AI_TIMEOUT_SECS
      - ASSISTANT_AI_WARMUP
      - ASSISTANT_CARD_PRODUCER_ENABLED
      - ASSISTANT_INTENT_CLASSIFIER_DIR
      - ASSISTANT_INTENT_CLASSIFIER_ENABLED
      - ASSISTANT_INTENT_CLASSIFIER_THREADS
      - ASSISTANT_INTENT_CLASSIFIER_THRESHOLD
      - ASSISTANT_UNDERSTANDING_DIR
      - ASSISTANT_UNDERSTANDING_ENABLED
      - ASSISTANT_UNDERSTANDING_THREADS
      - ASSISTANT_OLLAMA_ALLOW_ANY_PORT
      - ASSISTANT_OLLAMA_KEEP_ALIVE
      - ASSISTANT_OLLAMA_URL
      - ASSISTANT_RETENTION_DAYS
      - ASSISTANT_SEARCH_RERANK_ENABLED
