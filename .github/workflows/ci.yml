name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN: every job only reads the repository.
# Artifact upload and the Actions cache use the runner token, not this one.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PNPM_VERSION: "9"

jobs:
  lint-rust:
    name: Rust lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0" # Match the production Docker compiler.
          components: rustfmt, clippy

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-lint-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Service env allowlists cover every variable the code reads
        run: python3 scripts/check-service-env.py

      # CI builds no images: the production host builds them at deploy
      # (scripts/deploy.sh). This catches, on every push, a file compiled in
      # with include_str!/include_bytes! that a Dockerfile does not COPY
      # (10-31: the worker and api images failed on main), and
      # a binary a Dockerfile copies out of target/release that no binary
      # target builds (11-06: the deleted discover-brands bin).
      - name: Rust image files and binaries match their Dockerfiles
        run: python3 scripts/check-docker-includes.py

      # compose.yml alone and with every infra/docker overlay must parse and
      # resolve (`docker compose ... config`), as the production host runs it.
      - name: Compose files and overlays parse
        run: bash scripts/check-compose.sh

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # RustSec advisories against Cargo.lock; reviewed ignores live in
      # .cargo/audit.toml with their reasons.
      - name: cargo audit
        run: cargo audit

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-rust:
    name: Rust tests
    runs-on: ubuntu-latest
    # A full run takes about 20 minutes; a hung test fails within the hour
    # instead of holding the runner for GitHub's 6-hour default.
    timeout-minutes: 60
    env:
      DATABASE_URL: postgres://wello:wello@localhost:5432/wello
      TEST_DATABASE_URL: postgres://wello:wello@localhost:5432/wello
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      APP_ENV: local
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wello
          POSTGRES_USER: wello
          POSTGRES_PASSWORD: wello
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wello"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.0" # Match the production Docker compiler.

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-test-

      # The worker's PDF form check runs pdftotext (the runtime image installs it).
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      # Library tests include worker database regressions. Bootstrap before
      # either test suite rather than relying on API integration test order.
      - name: Apply migrations to the isolated test database
        run: cargo run -p api --bin api-migrate

      - name: cargo test (library and worker regressions)
        run: cargo test --workspace --lib -- --test-threads=1

      - name: cargo test (binary regressions)
        run: cargo test --workspace --bins -- --test-threads=1

      - name: cargo test (integration)
        run: cargo test --workspace --test '*' -- --test-threads=1

  lint-web:
    name: Web lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Match infra/docker/Dockerfile.web.
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint src/ --max-warnings 0

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Eligibility claim copy guard
        run: npm run test:copy

      - name: Build web for request race regressions
        run: npm run build
      - name: Install web browser regression tools
        run: npm ci --prefix ../../tools/design
      - name: Install browser for web regressions
        run: npx playwright install --with-deps chromium
        working-directory: tools/design
      - name: Check region response races and admin authorization changes
        run: node scripts/check-request-races.mjs

  test-mobile:
    name: Mobile types and session regressions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Every scripts/check-*.cjs (session, vault, forms, copy, Figma tokens, chips, ...)
        run: npm run test:checks

      - name: Install isolated design regression tools
        run: npm ci --prefix ../../tools/design
      - name: Verify original native splash assets
        run: node ../../tools/design/check-native-assets.mjs
      - name: Figma tokens still match the .fig
        run: node ../../tools/design/export-tokens.mjs --check
      - name: Category tile and accent colours still match the category images
        run: node ../../tools/design/category-colors.mjs --check
      - name: Export the mobile web app for fixture tests
        run: npx expo export --platform web --output-dir ../../releases/mobile-figma
        env:
          EXPO_NO_DOTENV: "1"
          EXPO_PUBLIC_API_URL: http://127.0.0.1:8080
      - name: App host CSP allows every inline script in the export
        run: python3 ../../scripts/check-app-csp.py ../../releases/mobile-figma
      - name: Install browser for mobile regressions
        run: npx playwright install --with-deps chromium
        working-directory: tools/design
      - name: Every scripts/check-*-web.mjs against the web export (resources, vault gate, assistant)
        run: npm run test:web-checks
      - name: Shared components render with their Figma values; Figma screens render at 390px without overflow
        run: node ../../tools/design/check-figma.mjs
      - name: Check onboarding, region, profile and school browser flows
        run: node ../../tools/design/check-ui.mjs
      - name: Preserve mobile regression reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-regression-evidence
          path: |
            docs/audits/mobile-figma-ui-20261001.json
            docs/audits/mobile-native-assets-20261001.json
            docs/design/validation/figma-20261001/
            docs/design/validation/figma-restore/
          retention-days: 14

