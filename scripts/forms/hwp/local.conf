<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Hangul office fonts named by government/university HWP forms are not
  redistributable. Without these rules fontconfig falls back to Noto Sans CJK,
  whose 1.45em line height overflows fixed-height table cells and clips text.
  Each name is bound to HwpSerif/HwpSans: Nanum Myeongjo/Gothic with an
  HWP-like 1.0em line box (tighten_fonts.py).
-->
<fontconfig>
  <!-- Myeongjo / Batang (serif) -->
  <match target="pattern">
    <test name="family" compare="contains" qual="any"><string>명조</string></test>
    <edit name="family" mode="assign" binding="strong"><string>HwpSerif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains" qual="any"><string>바탕</string></test>
    <edit name="family" mode="assign" binding="strong"><string>HwpSerif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains" qual="any"><string>궁서</string></test>
    <edit name="family" mode="assign" binding="strong"><string>HwpSerif</string></edit>
  </match>
  <!-- Gothic / Dotum / Gulim (sans) -->
  <match target="pattern">
    <test name="family" compare="contains" qual="any"><string>고딕</string></test>
    <edit name="family" mode="assign" binding="strong"><string>HwpSans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains" qual="any"><string>돋움</string></test>
    <edit name="family" mode="assign" binding="strong"><string>HwpSans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains" qual="any"><string>굴림</string></test>
    <edit name="family" mode="assign" binding="strong"><string>HwpSans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains" qual="any"><string>헤드라인</string></test>
    <edit name="family" mode="assign" binding="strong"><string>HwpSans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains" qual="any"><string>산세리프</string></test>
    <edit name="family" mode="assign" binding="strong"><string>HwpSans</string></edit>
  </match>
  <!-- Latin slots of HWP font sets -->
  <match target="pattern">
    <test name="family" compare="contains" qual="any"><string>HCI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Serif</string></edit>
  </match>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <!-- Anything else: a tightened Nanum face, never Noto Sans CJK SC. -->
  <alias><family>sans-serif</family><prefer><family>HwpSans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>HwpSerif</family></prefer></alias>
</fontconfig>
